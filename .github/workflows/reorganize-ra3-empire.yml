          for source, target in moves:
              source_path = Path(source)
              target_path = Path(target)
              if source_path.exists():
                  target_path.parent.mkdir(parents=True, exist_ok=True)
                  if target_path.exists():
                      raise RuntimeError(f"Target already exists: {target}")
                  source_path.rename(target_path)
              elif not target_path.exists():
                  raise RuntimeError(f"Missing source and target: {source}")

          for source, target in copies:
              source_path = Path(source)
              target_path = Path(target)
              if not source_path.exists():
                  raise RuntimeError(f"Missing shared texture: {source}")
              target_path.parent.mkdir(parents=True, exist_ok=True)
              if target_path.exists():
                  if source_path.read_bytes() != target_path.read_bytes():
                      raise RuntimeError(f"Conflicting shared texture: {target}")
              else:
                  shutil.copy2(source_path, target_path)

          root = Path("ra3帝国")
          categories = ["建筑", "战役单位", "步兵", "海军", "纳米核心", "航空", "载具"]
          expected_units = {
              "建筑": 13,
              "战役单位": 3,
              "步兵": 7,
              "海军": 6,
              "纳米核心": 2,
              "航空": 5,
              "载具": 6,
          }
          allowed = (".bbmodel", ".png", ".geo.json", ".animation.json")
          files = [path for path in root.rglob("*") if path.is_file()]
          direct_files = [
              path for category in categories
              for path in (root / category).iterdir() if path.is_file()
          ]
          bad_depth = [path for path in files if len(path.relative_to(root).parts) != 3]
          bad_extensions = [path for path in files if not str(path).endswith(allowed)]
          actual_units = {
              category: len([path for path in (root / category).iterdir() if path.is_dir()])
              for category in categories
          }
          if direct_files:
              raise RuntimeError(f"Files remain directly under categories: {direct_files}")
          if bad_depth:
              raise RuntimeError(f"Unexpected directory depth: {bad_depth}")
          if bad_extensions:
              raise RuntimeError(f"Unexpected file types: {bad_extensions}")
          if actual_units != expected_units:
              raise RuntimeError(f"Unit folders differ: {actual_units}")
          if len(files) != 234:
              raise RuntimeError(f"Expected 234 assets, found {len(files)}")

          Path(".github/workflows/reorganize-ra3-empire.yml").unlink()
          print(f"Validated {len(files)} assets in {sum(actual_units.values())} unit folders")
          PY
